name: Deploy Apna Management

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose environment to deploy'
        required: true
        default: 'stage'
        type: choice
        options:
          - stage
          - prod

      confirm_migration:
        description: 'Choose YES to run migration'
        required: true
        default: 'NO'  
        type: choice
        options:
          - "NO"  
          - "YES"  

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Install Serverless v3
        run: npm install -g serverless@3

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Lambda
        run: serverless deploy --stage=${{ github.event.inputs.environment }}


      - name: Fetch SSM Parameters
        if: ${{ github.event.inputs.confirm_migration == 'YES' }}
        run: |
          DB_CONNECTION=$(aws ssm get-parameter --name "/apna/${{ github.event.inputs.environment }}/DB_CONNECTION" --with-decryption --query "Parameter.Value" --output text)
          DB_HOST=$(aws ssm get-parameter --name "/apna/${{ github.event.inputs.environment }}/DB_HOST" --with-decryption --query "Parameter.Value" --output text)
          DB_PORT=$(aws ssm get-parameter --name "/apna/${{ github.event.inputs.environment }}/DB_PORT" --with-decryption --query "Parameter.Value" --output text)
          DB_DATABASE=$(aws ssm get-parameter --name "/apna/${{ github.event.inputs.environment }}/DB_DATABASE" --with-decryption --query "Parameter.Value" --output text)
          DB_USERNAME=$(aws ssm get-parameter --name "/apna/${{ github.event.inputs.environment }}/DB_USERNAME" --with-decryption --query "Parameter.Value" --output text)
          DB_PASSWORD=$(aws ssm get-parameter --name "/apna/${{ github.event.inputs.environment }}/DB_PASSWORD" --with-decryption --query "Parameter.Value" --output text)
          APP_KEY=$(aws ssm get-parameter --name "/apna/${{ github.event.inputs.environment }}/APP_KEY" --with-decryption --query "Parameter.Value" --output text)

          # Mask secrets in GitHub Actions logs
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$DB_USERNAME"
          echo "::add-mask::$DB_DATABASE"
          echo "::add-mask::$DB_HOST"
          echo "::add-mask::$APP_KEY"

          # Export to environment
          echo "DB_CONNECTION=$DB_CONNECTION" >> $GITHUB_ENV
          echo "DB_HOST=$DB_HOST" >> $GITHUB_ENV
          echo "DB_PORT=$DB_PORT" >> $GITHUB_ENV
          echo "DB_DATABASE=$DB_DATABASE" >> $GITHUB_ENV
          echo "DB_USERNAME=$DB_USERNAME" >> $GITHUB_ENV
          echo "DB_PASSWORD=$DB_PASSWORD" >> $GITHUB_ENV
          echo "APP_KEY=$APP_KEY" >> $GITHUB_ENV
          echo "APP_ENV=${{ github.event.inputs.environment }}" >> $GITHUB_ENV  

      - name: Run Migrations
        if: ${{ github.event.inputs.confirm_migration == 'YES' }}
        run: php artisan migrate --force


      - name: Upload Assets to S3
        run: |
          AWS_BUCKET=${{ secrets.AWS_S3_PREFIX }}-${{ github.event.inputs.environment }}
          # sync files
          aws s3 sync public/assets s3://$AWS_BUCKET/assets/ --delete
          aws s3 sync public/fonts s3://$AWS_BUCKET/fonts/ --delete
          aws s3 cp public/favicon.ico s3://$AWS_BUCKET/favicon.ico
          
          # Optional: Invalidate CloudFront cache
          CLOUDFRONT_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Origins.Items[0].DomainName=='$AWS_BUCKET.s3.ap-south-1.amazonaws.com'].Id | [0]" --output text)
          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_ID --paths "/*"  
