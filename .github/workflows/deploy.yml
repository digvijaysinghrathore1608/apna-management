name: Deploy Apna Management

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose environment to deploy'
        required: true
        default: 'stage'
        type: choice
        options:
          - stage
          - prod

      confirm_migration:
        description: 'Choose YES to run migration'
        required: true
        default: 'NO'  
        type: choice
        options:
          - "NO"  
          - "YES"  

  push:
    branches:
      - stage         

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'stage' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Serverless v3
        run: npm install -g serverless@3

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


      - name: Fetch SSM Parameters
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_migration == 'YES') || (github.event_name == 'push' && github.ref == 'refs/heads/stage') }}
        run: |
          DB_CONNECTION=$(aws ssm get-parameter --name "/apna/${{ github.event.inputs.environment || 'stage' }}/DB_CONNECTION" --with-decryption --query "Parameter.Value" --output text)
          DB_HOST=$(aws ssm get-parameter --name "/apna/${{ github.event.inputs.environment || 'stage' }}/DB_HOST" --with-decryption --query "Parameter.Value" --output text)
          DB_PORT=$(aws ssm get-parameter --name "/apna/${{ github.event.inputs.environment || 'stage' }}/DB_PORT" --with-decryption --query "Parameter.Value" --output text)
          DB_DATABASE=$(aws ssm get-parameter --name "/apna/${{ github.event.inputs.environment || 'stage' }}/DB_DATABASE" --with-decryption --query "Parameter.Value" --output text)
          DB_USERNAME=$(aws ssm get-parameter --name "/apna/${{ github.event.inputs.environment || 'stage' }}/DB_USERNAME" --with-decryption --query "Parameter.Value" --output text)
          DB_PASSWORD=$(aws ssm get-parameter --name "/apna/${{ github.event.inputs.environment || 'stage' }}/DB_PASSWORD" --with-decryption --query "Parameter.Value" --output text)
          APP_KEY=$(aws ssm get-parameter --name "/apna/${{ github.event.inputs.environment || 'stage' }}/APP_KEY" --with-decryption --query "Parameter.Value" --output text)

          # Mask secrets in GitHub Actions logs
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$DB_USERNAME"
          echo "::add-mask::$DB_DATABASE"
          echo "::add-mask::$DB_HOST"
          echo "::add-mask::$APP_KEY"

          # Export to environment
          echo "DB_CONNECTION=$DB_CONNECTION" >> $GITHUB_ENV
          echo "DB_HOST=$DB_HOST" >> $GITHUB_ENV
          echo "DB_PORT=$DB_PORT" >> $GITHUB_ENV
          echo "DB_DATABASE=$DB_DATABASE" >> $GITHUB_ENV
          echo "DB_USERNAME=$DB_USERNAME" >> $GITHUB_ENV
          echo "DB_PASSWORD=$DB_PASSWORD" >> $GITHUB_ENV
          echo "APP_KEY=$APP_KEY" >> $GITHUB_ENV
          echo "APP_ENV=${{ github.event.inputs.environment || 'stage' }}" >> $GITHUB_ENV  


      - name: Install Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Laravel Optimize (pre-build caches)
        run: |
          php artisan config:clear
          php artisan cache:clear
          php artisan route:clear
          php artisan view:clear

      - name: Deploy Lambda
        run: serverless deploy --stage=${{ github.event.inputs.environment || 'stage' }}
        
      - name: Run Migrations
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_migration == 'YES') || (github.event_name == 'push' && github.ref == 'refs/heads/stage') }}
        run: php artisan migrate --force

      - name: Run Seed
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_migration == 'YES') ||(github.event_name == 'push' && github.ref == 'refs/heads/stage') }}  
        run: php artisan db:seed --class=SuperAdminSeeder
